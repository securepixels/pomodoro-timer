<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    <div class="container">
        <div class="timer-container">
        <div class="timer-container">
            <div class="timer-tabs">
                <button class="tab-btn active" id="work-tab">Work Time</button>
                <button class="tab-btn" id="break-tab">Break Time</button>
            </div>
            
            <div class="timer-content">
                <div class="timer-display">
                    <span id="minutes">25</span>:<span id="seconds">00</span>
                </div>

                <div class="timer-controls">
                    <button id="start-btn" class="control-btn">Start</button>
                    <button id="pause-btn" class="control-btn">Pause</button>
                    <button id="reset-btn" class="control-btn">Reset</button>
                </div>

                <div class="timer-settings">
                    <div class="setting">
                        <label for="work-duration">Duration (minutes):</label>
                        <input type="number" id="work-duration" value="25" min="1" max="60">
                    </div>
                </div>
            </div>
        </div>
        </div>

        <div class="tasks-container">
            <h2>Tasks</h2>
            <div class="add-task-container">
                <input type="text" id="task-input" class="task-input" placeholder="What are you working on?">
                <textarea id="task-description" class="task-description" placeholder="Add description (optional)"></textarea>
                <div class="pomodoro-count">
                    <label for="pomodoro-number">Estimated Pomodoros:</label>
                    <input type="number" id="pomodoro-number" min="1" value="1" class="pomodoro-input">
                </div>
                <button id="add-task-btn" class="add-task-button">Add Task</button>
            </div>
            <div id="task-list" class="task-list">
                <!-- Tasks will be added here dynamically -->
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
